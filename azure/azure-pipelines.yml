# Manual runs only. HCP Terraform owns infrastructure; this pipeline deploys code.
trigger: none
pr: none

parameters:
  - name: azureServiceConnection
    type: string
    default: data-genie-azure
  - name: appName
    type: string
    default: data-genie-blueray321
  - name: resourceGroup
    type: string
    default: data_genie
  - name: appServiceSku
    type: string
    default: F1
    values: [F1, B1]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: TestAndPackage
        steps:
          - checkout: none
          - script: git clone --branch dev --single-branch --depth 1 https://github.com/blueraymusic/Data-Genie.git "$(Build.SourcesDirectory)/source"
            displayName: Get the current dev branch from GitHub
          - task: NodeTool@0
            inputs: { versionSpec: '22.x' }
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.12' }
          - script: |
              set -eu
              python -m pip install -r azure/requirements.txt -r backend/requirements-postgres.txt
              npm ci
              npm test
              npm run build
              python -B -m unittest
              python scripts/package_cloud.py --output "$(Build.ArtifactStagingDirectory)/data-genie.zip"
              cp scripts/configure_cloud_firewall.py scripts/verify_cloud.py "$(Build.ArtifactStagingDirectory)/"
              git rev-parse HEAD > "$(Build.ArtifactStagingDirectory)/commit.txt"
            workingDirectory: $(Build.SourcesDirectory)/source
            displayName: Test and build the application
          - publish: $(Build.ArtifactStagingDirectory)
            artifact: application

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: DeployApp
        environment: data-genie
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: current
                  artifact: application
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -eu
                      python3 "$(Pipeline.Workspace)/application/configure_cloud_firewall.py" --check
                      az webapp deploy --resource-group "$GENIE_RESOURCE_GROUP" --name "$GENIE_APP_NAME" --src-path "$(Pipeline.Workspace)/application/data-genie.zip" --type zip --clean true --restart true --only-show-errors
                      hostname=$(az webapp show --resource-group "$GENIE_RESOURCE_GROUP" --name "$GENIE_APP_NAME" --query defaultHostName --output tsv)
                      origin=$(az webapp config appsettings list --resource-group "$GENIE_RESOURCE_GROUP" --name "$GENIE_APP_NAME" --query "[?name=='GENIE_PUBLIC_URL'].value | [0]" --output tsv)
                      python3 "$(Pipeline.Workspace)/application/verify_cloud.py" "${origin:-https://$hostname}"
                  env:
                    GENIE_RESOURCE_GROUP: ${{ parameters.resourceGroup }}
                    GENIE_APP_NAME: ${{ parameters.appName }}
                    GENIE_APP_SERVICE_SKU: ${{ parameters.appServiceSku }}
